; ============================================================
;  config.cfg -- Unternehmensregister Financial Extractor
;
;  Edit with Notepad or any text editor.
;  Lines starting with ; are comments and are ignored.
;  Restart the app after saving.
; ============================================================


; -- Window --------------------------------------------------
[window]
width       = 1300
height      = 860
min_width   = 1040
min_height  = 700
sidebar_width   = 400
results_height  = 148


; -- Colours -------------------------------------------------
; Change accent to re-theme the whole app:
;   Indigo (default) #6366f1
;   Teal             #0d9488
;   Amber            #d97706
;   Rose             #e11d48
[colours]
background      = #0d0d14
panel           = #13131f
card            = #1c1c2e
card2           = #22223a
border          = #2d2d48
accent          = #6366f1
accent_light    = #818cf8
accent_dim      = #2d2d6e
text_primary    = #f1f5f9
text_secondary  = #94a3b8
text_muted      = #475569
green           = #22c55e
amber           = #f59e0b
red             = #ef4444
preview_bg      = #f8fafc
preview_text    = #0f172a


; -- Statement type colours (left stripe in each row) --------
[type_colours]
bilanz          = #3b82f6
guv             = #10b981
kapitalfluss    = #8b5cf6
other           = #6b7280


; -- Fonts ---------------------------------------------------
; Format: family, size[, bold]
[fonts]
hero    = Segoe UI, 14, bold
h1      = Segoe UI, 13, bold
h2      = Segoe UI, 11, bold
body    = Segoe UI, 12
small   = Segoe UI, 11
xsmall  = Segoe UI, 10
label   = Segoe UI, 9, bold


; -- Table rows ----------------------------------------------
; row_padding: top+bottom px inside each row.
;   3 = compact (default)   6 = comfortable   10 = spacious
[table_rows]
row_padding     = 3
checkbox_size   = 13
label_font      = Segoe UI, 10


; -- Export --------------------------------------------------
[export]
pdf_download_folder = ~/Downloads/UR_Extracts


; -- Network timeouts (milliseconds) ------------------------
[timeouts]
page_load            = 15000
search               = 20000
captcha              = 20000
download             = 15000
click                = 8000
captcha_wait_seconds = 2


; -- URL -----------------------------------------------------
[urls]
base_url = https://www.unternehmensregister.de/de
