  <text x="94" y="588" class="mute body">Segment table</text>
  <text x="94" y="601" class="mute mono xs">not disclosed — Anhang carries no segment split</text>

  <text x="62" y="632" class="mute mono xs">IMAGE LICENSING</text>
  <text x="62" y="648" class="mute sm">Internal POV only. External circulation requires clearance.</text>

  <!-- BR -->
  <rect x="486" y="464" width="418" height="200" class="box"/>
  <rect x="486" y="464" width="418" height="26" fill="#B08D1F"/>
  <text x="500" y="482" fill="#FFF" class="h2">Bottom-right</text>
  <text x="890" y="482" fill="#FFF3D0" class="mono xs" text-anchor="end">non-standard</text>

  <rect x="500" y="504" width="390" height="30" class="sel" rx="2"/>
  <circle cx="516" cy="519" r="4.5" class="mteal"/>
