<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" width="1440" height="980" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style><![CDATA[
      .ink   { fill: #14201E; }
      .mute  { fill: #6E7C78; }
      .teal  { fill: #0E3B37; }
      .mteal { fill: #2E7D6F; }
      .gold  { fill: #B08D1F; }
      .warn  { fill: #B3452F; }
      .mono  { font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace; }
      .h1    { font-size: 21px; font-weight: 600; letter-spacing: .2px; }
      .h2    { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; }
      .lbl   { font-size: 12.5px; font-weight: 600; }
      .body  { font-size: 12px; }
      .sm    { font-size: 10.5px; }
      .xs    { font-size: 9.5px; letter-spacing: .5px; }
      .rule  { stroke: #D3D8D6; stroke-width: 1; }
      .hair  { stroke: #E4E8E6; stroke-width: 1; }
      .box   { fill: #FFFFFF; stroke: #C6CFCC; stroke-width: 1.25; }
      .panel { fill: #F6F5F1; stroke: #DDE2E0; stroke-width: 1; }
      .sel   { fill: #EAF3F0; stroke: #2E7D6F; stroke-width: 1.5; }
      .dash  { stroke: #B08D1F; stroke-width: 1.25; stroke-dasharray: 4 3; fill: none; }
      .cal   { stroke: #B3452F; stroke-width: 1; fill: none; }
    ]]></style>
  </defs>

  <rect width="1440" height="980" fill="#FBFAF7"/>

  <!-- ── header ─────────────────────────────────────────────── -->
  <text x="48" y="52" class="ink h1">Slot assignment — screen 5</text>
  <text x="48" y="74" class="mute mono sm">Company Profile Builder · four-box "At a glance" · wireframe v1</text>
  <line x1="48" y1="92" x2="1392" y2="92" class="rule"/>

  <!-- entity strip -->
  <rect x="48" y="110" width="1344" height="46" class="panel"/>
  <text x="64" y="132" class="teal lbl">Textilkontor Walter Seidensticker GmbH &amp; Co. KG</text>
  <text x="64" y="148" class="mute mono xs">HRA 8217 · AG Bielefeld · GmbH &amp; Co. KG · FYE 30-04 · §267 gross · Konzernabschluss FY2015–FY2025</text>
  <rect x="1128" y="122" width="112" height="22" rx="2" fill="#EAF3F0" stroke="#2E7D6F"/>
  <text x="1184" y="137" class="mteal mono xs" text-anchor="middle">ENTITY CONFIRMED</text>
  <text x="1256" y="137" class="mute mono xs">change ▸</text>

  <!-- ── left: slot grid ────────────────────────────────────── -->
