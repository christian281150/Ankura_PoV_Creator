  <text x="532" y="565" class="mute mono xs">geo.revenue_split · §285 Nr. 4 · cov 0.62 · 7 of 12y</text>

  <rect x="500" y="584" width="390" height="46" fill="#FFFAEC" stroke="#B08D1F" rx="2"/>
  <text x="514" y="602" class="gold mono xs">⚠  NON-STANDARD LAYOUT</text>
  <text x="514" y="619" class="ink sm">Canonical for §267 gross is geo.revenue_split. Recorded in metadata.</text>

  <!-- ── right rail ─────────────────────────────────────────── -->
  <line x1="936" y1="180" x2="936" y2="700" class="hair"/>

  <text x="968" y="192" class="teal h2">Live preview</text>
  <rect x="968" y="208" width="424" height="238" fill="#FFF" stroke="#C6CFCC"/>
  <line x1="968" y1="248" x2="1392" y2="248" class="hair"/>
  <text x="984" y="228" class="teal" font-size="13" font-weight="600">At a glance: 107-year-old shirt &amp; blouse</text>
  <text x="984" y="242" class="teal" font-size="13" font-weight="600">specialist, revenue +8.4% to €111.8m in FY25</text>
  <line x1="1180" y1="248" x2="1180" y2="446" class="hair"/>
  <line x1="968" y1="352" x2="1392" y2="352" class="hair"/>
  <text x="984" y="266" class="mute mono xs">BUSINESS OVERVIEW</text>
  <text x="1196" y="266" class="mute mono xs">FINANCIALS</text>
  <text x="984" y="370" class="mute mono xs">PRODUCTS</text>
  <text x="1196" y="370" class="mute mono xs">FOOTPRINT</text>
  <g class="mute" font-size="9">
    <rect x="984" y="276" width="176" height="4" fill="#E4E8E6"/>
    <rect x="984" y="288" width="160" height="4" fill="#E4E8E6"/>
    <rect x="984" y="300" width="172" height="4" fill="#E4E8E6"/>
    <rect x="984" y="312" width="120" height="4" fill="#E4E8E6"/>
  </g>
  <!-- mini chart -->
  <g>
    <rect x="1200" y="316" width="14" height="22" class="mteal"/>
    <rect x="1220" y="308" width="14" height="30" class="mteal"/>
    <rect x="1240" y="304" width="14" height="34" class="mteal"/>
    <rect x="1260" y="318" width="14" height="20" class="mteal"/>
    <rect x="1280" y="322" width="14" height="16" class="mteal"/>
    <rect x="1300" y="312" width="14" height="26" class="mteal"/>
    <rect x="1320" y="326" width="14" height="12" class="mteal"/>
    <rect x="1340" y="318" width="14" height="20" class="mteal"/>
    <line x1="1200" y1="338" x2="1360" y2="338" class="hair"/>
  </g>
  <text x="984" y="438" class="mute" font-size="8">Note(s): 1. FY24 depressed by €8.8m inventory drawdown. 2. Revenue = Umsatzerlöse (§275 Nr. 1); excl. Bestandsveränderung.</text>

  <!-- basis guard -->
  <rect x="968" y="462" width="424" height="86" fill="#EAF3F0" stroke="#2E7D6F"/>
  <text x="984" y="482" class="teal h2">Presentation basis</text>
  <text x="984" y="502" class="ink body">Revenue series basis:  <tspan class="mono" font-weight="700">umsatzerloese</tspan></text>
  <text x="984" y="520" class="mute sm">Switching to <tspan class="mono">gesamtleistung</tspan> relabels the axis to "Gesamtleistung".</text>
  <text x="984" y="536" class="mute sm">A series labelled "Revenue" on any other basis fails V1 and blocks export.</text>

  <!-- coverage -->
  <text x="968" y="580" class="teal h2">Coverage</text>
  <g class="mono xs">
    <text x="968" y="602" class="mute">Financials</text>
    <text x="968" y="620" class="mute">Business model</text>
    <text x="968" y="638" class="mute">Geography split</text>
    <text x="968" y="656" class="mute">Products</text>
    <text x="968" y="674" class="mute">Management</text>
  </g>
  <g>
    <rect x="1120" y="594" width="200" height="7" fill="#E4E8E6"/><rect x="1120" y="594" width="186" height="7" class="mteal"/>
    <rect x="1120" y="612" width="200" height="7" fill="#E4E8E6"/><rect x="1120" y="612" width="176" height="7" class="mteal"/>
    <rect x="1120" y="630" width="200" height="7" fill="#E4E8E6"/><rect x="1120" y="630" width="124" height="7" class="gold"/>
    <rect x="1120" y="648" width="200" height="7" fill="#E4E8E6"/><rect x="1120" y="648" width="180" height="7" class="mteal"/>
    <rect x="1120" y="666" width="200" height="7" fill="#E4E8E6"/><rect x="1120" y="666" width="190" height="7" class="mteal"/>
  </g>
  <g class="mono xs" fill="#6E7C78">
    <text x="1336" y="602">.93</text><text x="1336" y="620">.88</text>
    <text x="1336" y="638">.62</text><text x="1336" y="656">.90</text><text x="1336" y="674">.95</text>
  </g>

  <!-- ── action bar ─────────────────────────────────────────── -->
  <line x1="48" y1="700" x2="1392" y2="700" class="rule"/>
  <rect x="48" y="718" width="132" height="34" fill="#FFF" stroke="#C6CFCC" rx="2"/>
  <text x="114" y="740" class="ink body" text-anchor="middle">Reset to canonical</text>
  <rect x="192" y="718" width="110" height="34" fill="#FFF" stroke="#C6CFCC" rx="2"/>
  <text x="247" y="740" class="ink body" text-anchor="middle">Lock layout</text>
  <rect x="314" y="718" width="110" height="34" fill="#FFF" stroke="#C6CFCC" rx="2"/>
  <text x="369" y="740" class="ink body" text-anchor="middle">Export JSON</text>
  <rect x="1240" y="718" width="152" height="34" fill="#C9CFCD" rx="2"/>
  <text x="1316" y="740" fill="#FFF" class="body" text-anchor="middle">Export .pptx</text>
  <text x="1224" y="740" class="warn mono xs" text-anchor="end">2 blocking flags unresolved</text>

  <!-- ── annotation key ─────────────────────────────────────── -->
  <line x1="48" y1="784" x2="1392" y2="784" class="hair"/>
  <text x="48" y="812" class="teal h2">Behaviour notes</text>

  <g class="mono xs" fill="#6E7C78">
    <text x="48" y="838" class="gold">A</text><text x="70" y="838" fill="#14201E">Entity confirmation is permanently human-gated. Screen 5 is unreachable without it — an entity error is undetectable downstream.</text>
    <text x="48" y="858" class="gold">B</text><text x="70" y="858" fill="#14201E">Unavailable blocks render greyed with a reason. Absence is information; never hide it and never silently substitute another block.</text>
    <text x="48" y="878" class="gold">C</text><text x="70" y="878" fill="#14201E">Dropdown order = coverage × confidence. Blocks with unresolved blocking flags are listed but not selectable.</text>
    <text x="48" y="898" class="gold">D</text><text x="70" y="898" fill="#14201E">Deviation from the canonical layout for the entity's §267 size class is permitted, badged gold, and written to profile metadata.</text>
    <text x="48" y="918" class="gold">E</text><text x="70" y="918" fill="#14201E">Notes written against V3–V6 flags become slide footnotes automatically. The footnote set updates live in the preview.</text>
    <text x="48" y="938" class="gold">F</text><text x="70" y="938" fill="#14201E">Lock layout freezes slot assignment so a re-run against fresher filings preserves the analyst's choices.</text>
  </g>
</svg>
