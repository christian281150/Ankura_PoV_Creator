  <text x="48" y="210" class="mute mono xs">Each box is a fixed slot. Only blocks whose eligible_slots include this slot are listed.</text>

  <!-- TL -->
  <rect x="48" y="226" width="418" height="222" class="box"/>
  <rect x="48" y="226" width="418" height="26" fill="#0E3B37"/>
  <text x="62" y="244" fill="#FFF" class="h2">Top-left</text>
  <text x="452" y="244" fill="#9FBDB6" class="mono xs" text-anchor="end">canonical</text>

  <rect x="62" y="266" width="390" height="30" class="sel" rx="2"/>
  <circle cx="78" cy="281" r="4.5" class="mteal"/>
  <text x="94" y="278" class="ink lbl">Business overview</text>
  <text x="94" y="291" class="mute mono xs">bo.business_overview · Lagebericht + site · cov 0.92</text>

  <rect x="62" y="302" width="390" height="30" fill="#FFF" stroke="#E4E8E6" rx="2"/>
  <circle cx="78" cy="317" r="4.5" fill="none" stroke="#9AA5A2"/>
  <text x="94" y="314" class="ink body">Identity &amp; ownership</text>
  <text x="94" y="327" class="mute mono xs">bo.identity_ownership · register · cov 0.98</text>

  <rect x="62" y="338" width="390" height="30" fill="#FFF" stroke="#E4E8E6" rx="2"/>
  <circle cx="78" cy="353" r="4.5" fill="none" stroke="#9AA5A2"/>
  <text x="94" y="350" class="ink body">Event timeline</text>
  <text x="94" y="363" class="mute mono xs">time.event_timeline · press + Lagebericht · cov 0.74</text>

  <line x1="62" y1="384" x2="452" y2="384" class="hair"/>
  <text x="62" y="404" class="mute mono xs">FOOTNOTES GENERATED</text>
  <text x="62" y="422" class="mute sm">1. Third-generation family ownership per Gesellschafterliste, Jul-2025</text>
  <text x="62" y="437" class="mute sm">2. Employee count is a company-website claim, not a filed figure</text>

  <!-- TR -->
  <rect x="486" y="226" width="418" height="222" class="box"/>
  <rect x="486" y="226" width="418" height="26" fill="#0E3B37"/>
  <text x="500" y="244" fill="#FFF" class="h2">Top-right</text>
  <text x="890" y="244" fill="#9FBDB6" class="mono xs" text-anchor="end">canonical</text>

  <rect x="500" y="266" width="390" height="30" class="sel" rx="2"/>
  <circle cx="516" cy="281" r="4.5" class="mteal"/>
  <text x="532" y="278" class="ink lbl">Revenue &amp; EBITDA series</text>
  <text x="532" y="291" class="mute mono xs">fin.revenue_ebitda_series · basis: umsatzerloese · 12y</text>

  <rect x="500" y="302" width="390" height="30" fill="#FFF" stroke="#E4E8E6" rx="2"/>
  <circle cx="516" cy="317" r="4.5" fill="none" stroke="#9AA5A2"/>
  <text x="532" y="314" class="ink body">Cost structure</text>
  <text x="532" y="327" class="mute mono xs">fin.cost_structure · GuV · cov 0.91</text>

  <rect x="500" y="338" width="390" height="30" fill="#FFF" stroke="#E4E8E6" rx="2"/>
  <circle cx="516" cy="353" r="4.5" fill="none" stroke="#9AA5A2"/>
  <text x="532" y="350" class="ink body">Balance summary</text>
  <text x="532" y="363" class="mute mono xs">fin.balance_summary · Bilanz · cov 0.88</text>

