  <text x="532" y="529" class="mute mono xs">geo.footprint_map · Anhang + site · cov 0.81</text>

  <rect x="500" y="540" width="390" height="30" fill="#FFF" stroke="#E4E8E6" rx="2"/>
  <circle cx="516" cy="555" r="4.5" fill="none" stroke="#9AA5A2"/>
