  <text x="514" y="415" class="ink sm">V5  FY24 Umsatzerlöse −18.6% YoY</text>
  <text x="514" y="428" class="ink sm">V6  FY24 material-cost ratio breaks trend −6.3pp</text>
  <text x="876" y="400" class="mteal mono xs" text-anchor="end">resolve ▸</text>

  <!-- BL -->
  <rect x="48" y="464" width="418" height="200" class="box"/>
  <rect x="48" y="464" width="418" height="26" fill="#0E3B37"/>
