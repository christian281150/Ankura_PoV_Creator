  <text x="452" y="482" fill="#9FBDB6" class="mono xs" text-anchor="end">canonical</text>

  <rect x="62" y="504" width="390" height="30" class="sel" rx="2"/>
  <circle cx="78" cy="519" r="4.5" class="mteal"/>
